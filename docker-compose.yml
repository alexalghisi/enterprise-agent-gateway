services:
    mongo:
        image: mongo:7
        ports:
            - "27017:27017"
        healthcheck:
            test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            interval: 5s
            retries: 10

    redis:
        image: redis:7-alpine
        ports:
            - "6379:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            retries: 10

    gateway:
        build: ./gateway
        ports:
            - "8080:8080"
        environment:
            GATEWAY_API_KEYS: demo-key:acme-insurance:voice-agent
            GATEWAY_SESSION_SECRET: local-development-secret
            GATEWAY_MONGO_URL: mongodb://mongo:27017
            GATEWAY_REDIS_URL: redis://redis:6379/0
        depends_on:
            mongo:
                condition: service_healthy
            redis:
                condition: service_healthy
