name: ci

on:
    push:
        branches: [main]
    pull_request:

jobs:
    gateway:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: gateway
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - run: pip install -e ".[dev]"
            - run: ruff check .
            - run: ruff format --check .
            - run: mypy
            - run: pytest

    mcp-server:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: mcp-server
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: mcp-server/package-lock.json
            - run: npm ci
            - run: npm run typecheck
            - run: npm test
            - run: npm run build

    e2e:
        needs: [gateway, mcp-server]
        runs-on: ubuntu-latest
        services:
            mongo:
                image: mongo:7
                ports: ["27017:27017"]
            redis:
                image: redis:7-alpine
                ports: ["6379:6379"]
        env:
            GATEWAY_MONGO_URL: mongodb://localhost:27017
            GATEWAY_REDIS_URL: redis://localhost:6379/0
            GATEWAY_SESSION_SECRET: ci-secret
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - run: pip install ./gateway
            - run: npm ci
              working-directory: mcp-server
            - run: ./scripts/e2e.sh
